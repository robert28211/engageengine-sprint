name: Email Intelligence Scanner

on:
  schedule:
    - cron: '0 6 * * *'    # 2am ET (every day)
    - cron: '0 11 * * *'   # 7am ET
    - cron: '0 17 * * *'   # 1pm ET
    - cron: '0 22 * * *'   # 6pm ET
  workflow_dispatch:          # allow manual trigger for testing

jobs:
  scan-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: .github/scripts

      - name: Run email scanner
        run: node .github/scripts/email-scanner.js
        env:
          IMAP_HOST: mail11.ezhostingserver.com
          IMAP_USER: robert@marketingperformance.net
          IMAP_PASS: ${{ secrets.IMAP_PASSWORD }}
          WORKER_URL: https://sprint.engageengine.cc
          EMAIL_SCANNER_TOKEN: ${{ secrets.EMAIL_SCANNER_TOKEN }}
